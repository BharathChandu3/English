{% extends "base.html" %}

{% block title %}Log In - SpeakMate AI{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="glass-card" style="width: 100%; max-width: 420px; padding: 40px; border-radius: 20px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-microphone-lines" style="font-size: 40px; color: var(--color-primary); filter: drop-shadow(0 0 10px var(--color-primary));"></i>
            <h2 style="font-size: 24px; font-weight: 700; margin-top: 15px;">Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-top: 6px;">Sign in to continue your English coaching</p>
        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" name="username" id="username" class="form-input" placeholder="Enter username or email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 24px; font-size: 14px;">
            <span style="color: var(--text-secondary);">New to SpeakMate?</span>
            <a href="{{ url_for('auth.register') }}" style="color: var(--color-primary); font-weight: 600; text-decoration: none; margin-left: 5px;">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
